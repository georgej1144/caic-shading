<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avalanche Forecast Shading Config</title>
    <link rel="stylesheet" href="style.css">
    <link rel="favicon" type="image/x-icon" href="caic-shading/favicon.ico">
</head>
<body>
    <div class="page-frame">
        <h1>NAC Forecast to Caltopo Shading</h1>
        <div class="border-frame">

            <div class="forecast-frame">
                <button class="forecast-button" id="get-forecast-button">Get Layers</button>
            </div>

            <div class="row-container">
                <div class="row" id="config-panel">
                    <h2>Options</h2>
                    <div class="options-frame">

                        <div class="form-group tooltip">
                            <label class="" for="Coordinates">Coordinates:
                                <span class="tooltiptext">Enter a coordinate pair from within the target area. Latitude then longitude, separated by space, comma, or |.</span>
                            </label>
                            <input class="widen-input" type="text" id="coords" placeholder="Enter coordinates" value="40.050308, -105.575101">
                        </div>
                        
                        <button class="collapsible tooltip active" id="treecover%">Treecover% Settings
                            <span class="tooltiptext">Use this option to separate alpine and sub-alpine terrain by treecover % from the National Land Cover Dataset. Adjust these for your target area if needed and remember this data set <i><b>is not perfect</b></i>.</span>
                        </button>
                        <div class="content">
                            <div class="form-group">
                                <label for="treecover-alp-tln">Above Treeline-Near Treeline Treecover%:</label>
                                <input type="number" id="treecover-alp-tln" value="1" min="0" max="100">
                            </div>
                            <div class="form-group">
                                <label for="treecover-tln-btl">Near Treeline-Below Treeline Treecover%: </label>
                                <input type="number" id="treecover-tln-btl" value="25" min="0" max="100">
                            </div>
                        </div>

                        <button class="collapsible tooltip" id="elevations">Elevation Settings
                            <span class="tooltiptext">Use this option to separate alpine and sub-alpine terrain by elevation. If used, these values <i><b>must</b></i> be adjusted to represent the target area.</span>
                        </button>
                        <div class="content">
                            <div class="form-group">
                                <label for="elevation-alp-tln">Above Treeline-Near Treeline Elevation:</label>
                                <input type="number" id="elevation-alp-tln" value="11500" min="0" max="30000">
                            </div>
                            <div class="form-group">
                                <label for="elevation-tln-btl">Near Treeline-Below Treeline Elevation: </label>
                                <input type="number" id="elevation-tln-btl" value="10500" min="0" max="30000">
                            </div>

                            <div class="form-group">
                                <div class="checkbox-container">
                                    <input class="unit-radio" type="radio" id="elevationFeet" name="elevationUnit" value="f" checked>
                                    <label for="elevationFeet">Feet</label>
                                </div>
                                <div class="checkbox-container">
                                    <input class="unit-radio" type="radio" id="elevationMeters" name="elevationUnit" value="m">
                                    <label for="elevationMeters">Meters</label>
                                </div>
                            </div>
                        </div>
                        
                        
                        <div class="form-group">
                            <label for="slide-slope-min">Slide Slope Min:</label>
                            <input class="widen-input" type="number" id="slide-slope-min" value="30" min="0" max="90">
                        </div>
                        <div class="form-group">
                            <label for="slide-slope-max">Slide Slope Max:</label>
                            <input class="widen-input" type="number" id="slide-slope-max" value="50" min="0" max="90" on>
                        </div>
                        
                        <div class="form-group">
                            <label>Extra Layers:</label>
                            <div id="include-helpers-container">
                                <div class="checkbox-container">
                                    <input type="checkbox" id="treecover_shading">
                                    <label for="treecover_shading">Treecover Shading</label>
                                </div>
                                <div class="checkbox-container">
                                    <input type="checkbox" id="elevation_shading">
                                    <label for="elevation_shading">Elevation Shading</label>
                                </div>
                                <div class="checkbox-container">
                                    <input type="checkbox" id="aspect_quadrants">
                                    <label for="aspect_quadrants">Aspect Quadrants</label>
                                </div>
                                <div class="checkbox-container">
                                    <input type="checkbox" id="aspect_gradient">
                                    <label for="aspect_gradient">Aspect Gradient</label>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="row" id="second-row">
                    <h2>Saved Coordinates</h2>
                    <div class="saved_menubar" id="saved_menubar">
                        <div class="saved_menubar_label" id="saved_menubar_label">
                            <input class="" type="text" id="saved_menubar_label_input" placeholder="Area Name">
                        </div>
                        <div class="saved_menubar_coords" id="saved_menubar_coords">
                            <input class="" type="text" id="saved_menubar_coords_input" placeholder="Coordinates">
                        </div>
                        <div class="saved_menubar_savebtn" id="saved_menubar_savebtn">
                            <button>
                                <svg xmlns="http://www.w3.org/2000/svg" height="20px" viewBox="0 -960 960 960" width="20px" fill="#000000">
                                    <path d="M816-672v456q0 29.7-21.15 50.85Q773.7-144 744-144H216q-29.7 0-50.85-21.15Q144-186.3 144-216v-528q0-29.7 21.15-50.85Q186.3-816 216-816h456l144 144Zm-72 30L642-744H216v528h528v-426ZM556.5-283.5Q588-315 588-360t-31.5-76.5Q525-468 480-468t-76.5 31.5Q372-405 372-360t31.5 76.5Q435-252 480-252t76.5-31.5ZM264-552h336v-144H264v144Zm-48-77v413-528 115Z"/>
                                </svg>
                            </button>
                        </div>
                    </div>
                    
                </div>
            </div>
        </div>
    </div>
    <script type="module" src="script.js"></script>
    <script type="module" src="api-util.js"></script>
    <script type="module" src="helper_layers.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@7/turf.min.js"></script>
</body>
</html>
